name: release

on:
  push:
    tags: ["v0.0.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  # Sigstore-signs the SBOM against this workflow's identity.
  attestations: write
  id-token: write

jobs:
  verify:
    name: verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sebastienrousseau/agtmls-spec
          path: .spec
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sebastienrousseau/agtmls
          path: .agtmls
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - env:
          AGTMLS_SPEC: ${{ github.workspace }}/.spec
          AGTMLS_HOME: ${{ github.workspace }}/.agtmls
        run: cargo test --all-features
      - name: Tag must match Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml ${VERSION}"
            exit 1
          }

      - name: Software bill of materials
        run: |
          cargo install --locked cargo-cyclonedx
          cargo cyclonedx --format json --all
      - name: Attest the build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "**/*.cdx.json"

  crates-io:
    name: Publish to crates.io
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      # Mints the OIDC identity crates.io exchanges for a short-lived token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -uxo pipefail
          out=$(cargo publish --all-features --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "$out" | grep -qE "already (exists|uploaded)" \
              && { echo "version already on crates.io — tolerating"; exit 0; }
            exit "$rc"
          fi

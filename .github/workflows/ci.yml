name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sebastienrousseau/agtmls-spec
          path: .spec
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - env:
          AGTMLS_SPEC: ${{ github.workspace }}/.spec
        run: cargo clippy --all-targets --all-features -- -D warnings
      - env:
          AGTMLS_SPEC: ${{ github.workspace }}/.spec
        run: cargo test --all-features
      - env:
          AGTMLS_SPEC: ${{ github.workspace }}/.spec
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  signatures:
    name: commits are signed
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify
        run: |
          git config gpg.ssh.allowedSignersFile KEYS.asc
          unsigned=0
          # --no-merges: on a pull_request event HEAD is the synthetic merge
          # commit GitHub creates, which no contributor signs.
          for commit in $(git rev-list --no-merges origin/${{ github.base_ref }}..HEAD); do
            author=$(git log -1 --format='%an' "$commit")
            # A bot's commits are signed by GitHub's key, not by a maintainer
            # key in KEYS.asc, so they verify as E here. That is a different
            # trust path -- authenticated by the forge, not by us -- and this
            # gate governs contributor commits. Excluding them is deliberate;
            # a human commit pushed to a bot's branch is still checked.
            case "$author" in
              *"[bot]") echo "skipping bot commit $commit ($author)"; continue ;;
            esac
            status=$(git log -1 --format='%G?' "$commit")
            if [ "$status" != "G" ] && [ "$status" != "U" ]; then
              echo "::error::unsigned or unverifiable commit $commit (%G? = $status)"
              unsigned=1
            fi
          done
          test "$unsigned" -eq 0
